# /etc/environment.d/10-dsh-env.conf — dsh 便携盒运行环境变量
# systemd 与登录 shell 均读取本文件（systemd EnvironmentFile 兼容此格式）。
# 文件权限 600（root 只读），DEEPSEEK_API_KEY 切勿入库或入 dotfile。

# home 层 patch 位置（$DSH_HOME/cordis.patch.yml），指向 SD 卡
# 来源: apps/cli/src/profile-boot.ts#L44
DSH_HOME=/mnt/sdcard/dsh

# 沙箱权限档：read-only / workspace-write / danger-full-access
# 来源: packages/bundle/base/cordis.patch.yml#L191
DSH_PERMISSION_MODE=read-only

# 关闭遥测，省蜂窝流量
# 来源: apps/cli/src/profile-boot.ts#L56
DSH_TELEMETRY_DISABLED=1

# DeepSeek API 凭据（真实运行必需，03 脚本交互填入）
DEEPSEEK_API_KEY=

# 可选：API 代理地址（4G 出网经代理时设置）
# DEEPSEEK_BASE_URL=https://your-proxy.example.com
